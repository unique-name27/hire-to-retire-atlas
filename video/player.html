<!doctype html>
<html><head><meta charset="utf-8"><title>Atlas tutorial renderer</title>
<style>
@font-face{font-family:Jakarta;font-weight:400;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Jakarta;font-weight:500;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Jakarta;font-weight:600;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Jakarta;font-weight:700;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Jakarta;font-weight:800;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format("woff2")}
:root{
  --ink:#16213b;--ink2:#38425a;--muted:#667089;--line:#e3dccf;--line2:#efe9de;--bg:#f7f2ea;--card:#fffdf9;
  --navy:#1e3a6e;--accent:#2f5bd3;--accent-soft:#e3ebff;--coral:#f2665a;--coral-soft:#ffe4e0;--amber:#f4a62a;--amber-soft:#fff0d6;
  --teal:#11998a;--teal-soft:#d9f3ef;--violet:#6f5cf1;--violet-soft:#ece8ff;--green:#1e9b57;--green-soft:#dcf5e6;--red:#df4a4f;--red-soft:#fde2e2;
  --ava:#11998a;--leo:#ef7b2d;
}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Jakarta,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.will{will-change:transform,opacity;transform-origin:50% 50%}
/* background */
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.dots{position:absolute;inset:0;background-image:radial-gradient(#e2d8c7 1.6px,transparent 1.6px);background-size:34px 34px;opacity:.55}
/* brand bar */
#brand{left:56px;top:34px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:26px;color:var(--ink2)}
#brand .logo{width:48px;height:48px;border-radius:14px;background:var(--navy);display:grid;place-items:center}
#brand .ep{font-weight:500;color:var(--muted)}
#prog{right:56px;top:52px;width:300px;height:10px;border-radius:5px;background:#e8e0d2;overflow:hidden}
#prog i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:0 50%;border-radius:5px}
/* content */
#content{left:110px;top:118px;width:1700px;height:690px}
.scene{position:absolute;inset:0;opacity:0}
.h2{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 34px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;box-shadow:0 18px 40px -22px rgba(40,30,10,.35)}
/* captions */
#cap{left:360px;width:1200px;bottom:42px;height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
#cap .box{background:rgba(22,33,59,.92);color:#fff;border-radius:22px;padding:16px 30px 18px;font-size:40px;font-weight:600;line-height:1.28;text-align:center;max-width:1200px;position:relative}
#cap .who{position:absolute;top:-17px;left:26px;font-size:20px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:999px;color:#fff}
/* hosts */
.host{width:230px;height:230px;bottom:40px}
.host .ring{position:absolute;inset:0;border-radius:50%}
.host svg{position:absolute;inset:0}
.host .tag{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-weight:800;font-size:24px;color:#fff;padding:4px 18px;border-radius:999px;letter-spacing:.02em}
/* chip */
#chip{width:190px;height:190px;left:1640px;top:140px;transform-origin:50% 90%}
#chip .bubble{position:absolute;right:120px;top:-22px;min-width:66px;height:66px;padding:0 16px;border-radius:33px;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:36px;font-weight:800}
/* toast */
.toast{position:absolute;right:30px;bottom:30px;background:var(--ink);color:#fff;font-size:28px;font-weight:700;padding:16px 26px;border-radius:16px;display:flex;gap:12px;align-items:center}
/* pills */
.pill{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;font-size:24px;font-weight:700;white-space:nowrap}
.st-none{background:#eceae4;color:#6a6559}.st-draft{background:var(--amber-soft);color:#9a5d00}.st-review{background:var(--accent-soft);color:#2448a8}
.st-approved{background:var(--green-soft);color:#167343}.st-live{background:var(--green);color:#fff}.st-overdue{background:var(--red);color:#fff}
/* table */
.win{position:absolute;left:100px;top:0;width:1500px;overflow:hidden}
.win .bar{height:58px;border-bottom:2px solid var(--line2);display:flex;align-items:center;gap:10px;padding:0 24px;font-size:22px;font-weight:700;color:var(--muted)}
.win .bar i{width:16px;height:16px;border-radius:50%;display:inline-block}
.win .filters{display:flex;gap:12px;align-items:center;padding:18px 28px;border-bottom:2px solid var(--line2);min-height:84px;font-size:24px;color:var(--muted);font-weight:600}
.fchip{height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--accent);background:var(--accent-soft);color:#2448a8;display:inline-flex;align-items:center;font-weight:700;font-size:23px}
table.t{width:100%;border-collapse:collapse;font-size:28px}
table.t th{font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:16px 28px;font-weight:700}
table.t td{padding:0 28px;height:78px;border-top:2px solid var(--line2);white-space:nowrap;position:relative}
table.t td.id{font-family:ui-monospace,Menlo,monospace;font-size:24px;color:var(--ink2);font-weight:600}
table.t tr.hl td{background:var(--accent-soft)}
table.t tr.hl td:first-child{box-shadow:inset 8px 0 0 var(--accent)}
.cell-flash{animation:none}
.cursor{position:absolute;width:44px;height:44px;left:0;top:0;z-index:5}
.ripple{position:absolute;width:70px;height:70px;border-radius:50%;border:4px solid var(--accent);left:-35px;top:-35px}
</style></head>
<body><div id="stage"></div>
<script>
"use strict";
/* ================= tiny deterministic animation engine ================= */
const TW = new Map();            // el -> [{p, a, b, t0, t1, e}]
const SETS = [];                 // {at, until, fn}
const HOOKS = [];                // fn(t)
const SFX = [];                  // {t, kind}
const E = {
  lin: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  el: (x) => (x === 0 || x === 1 ? x : Math.pow(2, -9 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3.2) + 1),
};
const DEF = { x: 0, y: 0, s: 1, sx: 1, sy: 1, r: 0, o: 1 };
function tw(el, props, t0, dur = 0.5, e = "out") {
  if (!el) return;
  if (!TW.has(el)) TW.set(el, []);
  for (const [p, v] of Object.entries(props)) TW.get(el).push({ p, a: v[0], b: v[1], t0, t1: t0 + Math.max(dur, 0.0001), e: E[e] || E.out });
}
function at(t0, fn, until = Infinity) { SETS.push({ at: t0, until, fn }); }
function sfx(t, kind) { SFX.push({ t: Math.max(0, +t.toFixed(3)), kind }); }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function valueAt(list, t) {
  let cur = null, first = null;
  for (const k of list) { if (!first || k.t0 < first.t0) first = k; if (k.t0 <= t && (!cur || k.t0 >= cur.t0)) cur = k; }
  if (!cur) return first.a;
  const x = clamp((t - cur.t0) / (cur.t1 - cur.t0));
  return cur.a + (cur.b - cur.a) * cur.e(x);
}
function renderAt(t) {
  for (const [el, list] of TW) {
    const by = {};
    for (const k of list) (by[k.p] = by[k.p] || []).push(k);
    const v = { ...DEF };
    for (const p in by) v[p] = valueAt(by[p], t);
    if ("o" in by) el.style.opacity = v.o.toFixed(3);
    if ("w" in by) el.style.width = v.w.toFixed(1) + "px";
    if ("dash" in by) el.style.strokeDashoffset = v.dash.toFixed(1);
    if ("clip" in by) el.style.clipPath = `inset(0 ${(100 - v.clip).toFixed(2)}% 0 0)`;
    if (["x", "y", "s", "sx", "sy", "r"].some((p) => p in by))
      el.style.transform = `translate(${v.x.toFixed(1)}px,${v.y.toFixed(1)}px) rotate(${v.r.toFixed(2)}deg) scale(${(v.s * v.sx).toFixed(4)},${(v.s * v.sy).toFixed(4)})`;
  }
  for (const s of SETS) s.fn(t >= s.at && t < s.until);
  for (const h of HOOKS) h(t);
}
/* seeded random */
let SEED = 7; const rnd = () => ((SEED = (SEED * 16807) % 2147483647) / 2147483647);

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, cls, html, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COLORS = ["var(--accent)", "var(--coral)", "var(--teal)", "var(--amber)", "var(--violet)", "var(--green)"];
const SOFTS = ["var(--accent-soft)", "var(--coral-soft)", "var(--teal-soft)", "var(--amber-soft)", "var(--violet-soft)", "var(--green-soft)"];
function stClass(v) {
  const s = String(v).toLowerCase();
  if (s.startsWith("not started") || s === "unassigned" || s === "not set") return "st-none";
  if (s.startsWith("drafting")) return "st-draft";
  if (s.startsWith("in review")) return "st-review";
  if (s.startsWith("approved")) return "st-approved";
  if (s.startsWith("live")) return "st-live";
  if (s.startsWith("overdue")) return "st-overdue";
  return "";
}
const STATUS_WORDS = /^(not started|drafting|in review|approved|live|overdue)$/i;
function cellHtml(v) { return STATUS_WORDS.test(v) ? `<span class="pill ${stClass(v)}">${esc(v)}</span>` : esc(v); }
function rel(el) { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2 }; }
const LOGO = `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M4 15h22M15 4c4 4 4 18 0 22M15 4c-4 4-4 18 0 22" fill="none" stroke="#fff" stroke-width="2.2"/></svg>`;
const CHECK = (c = "#fff", w = 5) => `<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M9 21l7 7 15-16" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CROSS = (c = "#fff", w = 5) => `<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M12 12l16 16M28 12L12 28" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/></svg>`;

/* reveal times for n items in a scene, honoring line.show */
function revealTimes(sc, n, stagger = 0.28) {
  const out = []; const lines = sc.lines;
  const hasShow = lines.some((l) => l.show != null);
  if (!hasShow) {
    const a = lines[0].start + 0.15, b = Math.max(a + 0.1, lines[lines.length - 1].start + 0.2);
    for (let i = 0; i < n; i++) out.push(n === 1 ? a : a + (b - a) * (i / (n - 1)));
    return out;
  }
  let shown = 0;
  for (const l of lines) {
    if (l.show == null) continue;
    const k = Math.min(n, l.show);
    for (let i = shown; i < k; i++) out.push(l.start + 0.1 + (i - shown) * stagger);
    shown = Math.max(shown, k);
  }
  const last = lines[lines.length - 1];
  for (let i = shown; i < n; i++) out.push(last.start + 0.1 + (i - shown) * stagger);
  return out;
}
function popIn(el, t, dur = 0.55) { tw(el, { o: [0, 1] }, t, 0.25); tw(el, { s: [0.6, 1] }, t, dur, "back"); }
function slideIn(el, t, dy = 40, dur = 0.55) { tw(el, { o: [0, 1] }, t, 0.3); tw(el, { y: [dy, 0] }, t, dur, "out"); }
function heading(root, text, t) { const e = h("div", "h2 will", esc(text), root); slideIn(e, t, 30); return e; }
</script>
<script src="hosts.js"></script>
<script src="scenes.js"></script>
<script src="main.js"></script>
</body></html>
